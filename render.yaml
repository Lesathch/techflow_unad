services:
  - type: web
    name: techflow-unad
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24.22.1'
      - key: HOST
        value: '0.0.0.0'
      - key: SECURE_COOKIE
        value: 'true'
      - key: DEMO_MODE
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
