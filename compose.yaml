name: techflow
services:
  techflow-db:
    image: postgres:16.13-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: techflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecuta node scripts/setup-env.mjs}
      POSTGRES_DB: techflow
    volumes:
    - techflow_pg_data:/var/lib/postgresql/data
    - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U techflow -d techflow
      interval: 5s
      timeout: 5s
      retries: 15
  techflow:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      techflow-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
    command:
    - node
    - server.mjs
    environment:
      PORT: 3000
      DATABASE_URL: postgres://techflow:${DB_PASSWORD}@techflow-db:5432/techflow
      APP_KEY: ${APP_KEY:?Ejecuta node scripts/setup-env.mjs}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta contraseña}
      DEMO_MODE: ${DEMO_MODE:-true}
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN:?Falta token}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/techflow-receive
      SECURE_COOKIE: 'true'
    volumes:
    - techflow_app_data:/data
    ports:
    - 127.0.0.1:3002:3000
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.47.4}
    restart: unless-stopped
    depends_on:
      techflow-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: techflow-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: techflow
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Falta clave}
      N8N_HOST: n8n.localhost
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.localhost:3442/
      N8N_PROXY_HOPS: 1
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      GENERIC_TIMEZONE: America/Bogota
    ports:
    - 127.0.0.1:5678:5678
    volumes:
    - techflow_n8n_data:/home/node/.n8n
  techflow-proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
    - 127.0.0.1:3442:443
    volumes:
    - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    - techflow_caddy_data:/data
    - techflow_caddy_config:/config
    depends_on:
    - techflow
    - n8n
  techflow-backup:
    profiles:
    - tools
    build: .
    user: root
    env_file: .env
    environment:
      DATABASE_URL: postgres://techflow:${DB_PASSWORD}@techflow-db:5432/techflow
    volumes:
    - ./backups:/app/backups
    entrypoint:
    - node
    - scripts/backup.mjs
volumes:
  techflow_pg_data: null
  techflow_app_data: null
  techflow_caddy_data: null
  techflow_caddy_config: null
  techflow_n8n_data: null
